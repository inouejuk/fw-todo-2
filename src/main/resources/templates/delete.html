<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>削除確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title">削除確認</h1>
        <p class="confirm-value">やること：<span th:text="${todo.title}"></span></p>
        <p class="confirm-value">ジャンル：<span th:text="${todo.category}"></span></p>
        <p class="confirm-value">期限：<span th:text="${todo.dueDate}"></span></p>
        <form method="post" th:action="@{/todos/{id}/delete(id=${todo.id})}">
            <div class="confirm-actions">
                <button class="btn" type="submit">消す</button>
                <a class="btn sub" href="/todos">やめる</a>
            </div>
        </form>
    </div>
</body>
</html>
